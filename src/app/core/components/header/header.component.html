<nav class="bg-gray-800">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 items-center justify-between">
      <div class="flex items-center">
        <!-- CAMPANY ICON -->
        <div class="shrink-0">
          <img class="size-8" [src]="store.logoImage()" alt="Your Company" />
        </div>
      </div>
      <div class="hidden md:block">
        <div class="ml-4 flex items-center md:ml-6">
          <!-- USER NOTIFICATION ICON -->
          <p-button
            [icon]="'pi pi-bell'"
            styleClass="relative inline-flex items-center justify-center rounded-md bg-gray-800 p-2 text-gray-400 hover:bg-gray-700 hover:text-white focus:outline-hidden"
            [rounded]="true"
            [text]="true"
            [size]="'large'"
          />
          <div class="relative ml-3" #menuRef>
            <div>
              <button
                type="button"
                class="relative cursor-pointer flex max-w-xs items-center rounded-full bg-gray-800 text-sm focus:ring-2 focus:ring-gray-400 focus:ring-offset-2 focus:ring-offset-gray-800 hover:ring-2 hover:ring-gray-400 hover:ring-offset-2 hover:ring-offset-gray-800 focus:outline-hidden"
                id="user-menu-button"
                aria-expanded="false"
                aria-haspopup="true"
                (click)="toggleMenu($event)"
              >
                <!-- USER ICON -->
                <span class="absolute -inset-1.5"></span>
                <span class="sr-only">Open user menu</span>
                <img class="size-8 rounded-full" [src]="store.userImage()" alt="" />
              </button>
            </div>
            @if (showMenu) {
              <div
                class="absolute right-0 z-10 mt-2 w-48 origin-top-right rounded-md bg-gray-800 border-gray-400 border-2 shadow-lg ring-1 ring-black/5 focus:outline-hidden"
                role="menu"
                aria-orientation="vertical"
                aria-labelledby="user-menu-button"
                tabindex="-1"
              >
                @for (item of menuItems; track item.label) {
                  <a
                    [href]="item.url"
                    class="flex items-center gap-2 px-4 font-medium py-2 text-base text-gray-400 hover:bg-gray-700 hover:text-white focus:text-white focus:bg-gray-700 focus:outline-none"
                    role="menuitem"
                  >
                    <i class="pi {{ item.icon }} text-lg"></i>
                    {{ item.label | translate }}
                  </a>
                }
              </div>
            }
          </div>
        </div>
      </div>
      <!-- MOBILE TOGGLE ICON -->
      <div class="-mr-2 flex md:hidden">
        <p-button
          [icon]="'pi ' + (showMenu ? 'pi-times' : 'pi-bars')"
          styleClass="relative inline-flex items-center justify-center rounded-md bg-gray-800 p-2 text-gray-400 hover:bg-gray-700 hover:text-white focus:outline-hidden"
          [rounded]="true"
          [text]="true"
          [size]="'large'"
          (click)="toggleMenu($event)"
        />
      </div>
    </div>
  </div>

  @if (showMenu) {
    <div class="md:hidden absolute top-16 left-0 w-full bg-gray-800 z-50" id="mobile-menu">
      <div class="border-t border-gray-700 pt-4 pb-3">
        <div class="flex items-center px-5">
          <!-- MOBILE USER INFO -->
          <div class="shrink-0">
            <img class="size-10 rounded-full" [src]="store.userImage()" alt="" />
          </div>
          <div class="ml-3">
            <div class="text-base/5 font-medium text-white">{{ store.userName() }}</div>
            <div class="text-sm font-medium text-gray-400">{{ store.userEmail() }}</div>
          </div>
          <p-button
            [icon]="'pi pi-bell'"
            class="ml-auto"
            styleClass="inline-flex items-center justify-center rounded-md bg-gray-800 p-2 text-gray-400 hover:bg-gray-700 hover:text-white focus:outline-hidden"
            [rounded]="true"
            [text]="true"
            [size]="'large'"
          />
        </div>
        <div class="mt-3 space-y-1 px-2">
          @for (item of menuItems; track item.label) {
            <a
              [href]="item.url"
              class="flex items-center gap-2 rounded-md px-3 py-2 text-base font-medium text-gray-400 hover:bg-gray-700 hover:text-white"
            >
              <i class="pi {{ item.icon }} text-lg"></i>
              {{ item.label | translate }}
            </a>
          }
        </div>
      </div>
    </div>
  }
</nav>
